<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GST Lernpfade</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#11141b);--ink:light-dark(#1b1e27,#e9ebf1);--muted:light-dark(#5a6070,#a5abba);
--panel:light-dark(#f3f6fa,#191e28);--line:light-dark(#d6dde8,#2d3544);--accent:light-dark(#dc2f28,#ff5c50)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
header{background:#0e131d;color:#eef1f7;padding:clamp(32px,5vw,64px) max(5vw,16px)}
h1,h2{font-family:Lexend,system-ui,sans-serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(32px,5vw,48px)}
h2{font-size:22px;margin-top:1.6em}
header p{color:#c6ccd8;max-width:60ch;margin:0}
main{max-width:1100px;margin:0 auto;padding:8px max(5vw,16px) 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:6px;padding:0 0 16px;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-decoration:none;min-height:44px}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card b{font-family:Lexend,system-ui,sans-serif;font-size:18px;display:block;padding:4px 18px 0}
a.card small{color:var(--muted);font-size:15px;padding:0 18px}
.thumb{display:block;aspect-ratio:16/7;background:#0e131d;border-bottom:1px solid var(--line)}
.thumb svg{display:block;width:100%;height:100%}
footer{color:var(--muted);font-size:14px;padding:0 max(5vw,16px) 32px;max-width:1100px;margin:0 auto}
.herohead{display:flex;gap:24px;align-items:flex-start;justify-content:space-between}
.qrbtn{flex:none;width:136px;background:#fff;border:0;border-radius:12px;padding:8px 8px 4px;cursor:pointer;color:#1b1e27;font:600 12px Lexend,sans-serif;text-align:center}
.qrbtn svg{display:block;width:120px;height:120px}
.qrbtn:hover,.qrbtn:focus-visible{outline:3px solid #ff5c50}
dialog.qrdlg{border:0;border-radius:18px;padding:24px;background:#fff;color:#1b1e27;text-align:center;max-width:95vw}
dialog.qrdlg::backdrop{background:rgba(8,10,16,.8)}
dialog.qrdlg svg{width:min(70vh,80vw);height:min(70vh,80vw);display:block;margin:0 auto}
dialog.qrdlg p{font:600 clamp(16px,2.4vw,26px) Lexend,sans-serif;margin:12px 0;word-break:break-all}
dialog.qrdlg button{font:600 16px Lexend,sans-serif;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid #d6dde8;background:#f3f6fa;color:#1b1e27;cursor:pointer}
@media(max-width:640px){.qrbtn{width:96px}.qrbtn svg{width:80px;height:80px}}
</style>
</head>
<body>
